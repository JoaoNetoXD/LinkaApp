<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F3F4F8" />
  <meta name="description" content="Empreende iCEV: cupons de desconto das empresas dos alunos do iCEV. Retire seu código e compre direto com a empresa." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Empreende iCEV" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Empreende iCEV — Conexões que geram negócios" />
  <meta property="og:description" content="Cupons de desconto das empresas dos alunos do iCEV. Retire seu código e compre direto com a empresa." />
  <meta property="og:url" content="__SITE_URL__" />
  <meta property="og:site_name" content="Empreende iCEV" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:image" content="__SITE_URL__/brand/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Logo Empreende iCEV — Conexões que geram negócios." />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Empreende iCEV — Conexões que geram negócios" />
  <meta name="twitter:description" content="Cupons de desconto das empresas dos alunos do iCEV. Retire seu código e compre direto com a empresa." />
  <meta name="twitter:image" content="__SITE_URL__/brand/og-image.png" />

  <title>Empreende iCEV</title>

  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
  <link rel="alternate icon" type="image/png" href="/icons/favicon.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=Geist+Mono:wght@500..600&display=swap" rel="stylesheet">
  <style>
    body{margin:0;background:#F3F4F8;color:#182A50;font-family:'Inter',system-ui,sans-serif}
    .boot-screen{min-height:100vh;display:grid;place-items:center;align-content:center;gap:28px}
    .boot-logo{width:min(220px,58vw);height:auto;animation:boot-in .6s cubic-bezier(.22,1,.36,1) both}
    .boot-loader{width:112px;height:3px;border-radius:3px;overflow:hidden;background:#E4E6EE}
    .boot-loader:after{content:'';display:block;width:40%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#182A50,#C0176B 64%,#ED1E79);animation:boot-loader 1s cubic-bezier(.65,0,.35,1) infinite}
    @keyframes boot-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @keyframes boot-loader{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
    @media (prefers-reduced-motion:reduce){.boot-logo{animation:none}.boot-loader:after{animation-duration:2.4s}}
  </style>
</head>
<body>
  <div id="app">
    <div class="boot-screen" role="status" aria-label="Carregando Empreende iCEV">
      <img class="boot-logo" src="/brand/logo.svg" alt="Empreende iCEV — Conexões que geram negócios." width="220" height="127" />
      <div class="boot-loader"></div>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-container"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
